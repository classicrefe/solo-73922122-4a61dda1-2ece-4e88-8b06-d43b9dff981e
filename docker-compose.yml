name: bearing-ledger

services:
  api:
    build: .
    image: bearing-ledger:latest
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - bearing-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  bearing-data:
